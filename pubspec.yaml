name: kottonkandy
description: "Final Year Project"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  webview_flutter: ^4.10.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0



  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.6
  google_sign_in: ^6.2.1
  firebase_database: ^12.4.7
  firebase_storage: ^13.4.6

  # Other packages
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  shared_preferences: ^2.5.3
  paystack_flutter_sdk: ^0.0.1-alpha.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/KottonKandy_icon.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/